# Integration overlay: keyless run on the fake provider, stage-router scheme selected by default.
- id: agent-default-model
  config:
    provider: stage-router
    model: test

- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: session-title-llm
  disabled: true

- insert:
    - id: fake-llm
      name: ./fake-llm.js
    - id: stage-router
      name: ../../../lib/index.js
      config:
        jev:
          baseUrl: http://fake-jev.invalid/v1
          model: jev-test
          token: test-token
          timeoutMs: 1500
          minConfidence: 0.6
          contextTurns: 2
        schemes:
          - id: test
            name: 测试
            initialStage: code
            subagents: { enabled: true, stage: inherit, classify: true }
            stages:
              - id: plan
                name: 规划
                description: design and planning
                route: { provider: fake, model: m-plan, reasoningEffort: max }
                prompt: STAGE_PROMPT_PLAN
                planMode: enter
              - id: code
                name: 编码
                description: write code
                route: { provider: fake, model: m-code }
                planMode: exit
                tiers:
                  source: planner-then-judge
                  default: heavy
                  levels:
                    - { id: light, description: local change, route: { provider: fake, model: m-light, reasoningEffort: 'off' } }
                    - { id: heavy, description: cross-module work, route: { provider: fake, model: m-heavy, reasoningEffort: max } }
              - id: review
                name: 审查
                description: review changes
                route: { provider: fake, model: m-review, reasoningEffort: high }
                prompt: STAGE_PROMPT_REVIEW
              - id: broken
                name: 损坏
                description: stage whose model is missing
                route: { provider: fake, model: m-missing }
            transitions:
              - { from: '*', to: plan, on: plan_mode_on }
              - { from: plan, to: code, on: plan_approved }
              - { from: code, to: review, on: todos_done }
              - { from: '*', to: '*', on: user_message }
